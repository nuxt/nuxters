name: Update contributors

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect contributors
        env:
          NUXT_GITHUB_TOKEN: ${{ secrets.NUXT_GITHUB_TOKEN }}
        run: pnpm collect:contributors

      - name: Collect public contributor locations
        env:
          NUXT_GITHUB_TOKEN: ${{ secrets.NUXT_GITHUB_TOKEN }}
        run: pnpm collect:people

      - name: Commit and push if changed
        run: |
          FILE_SIZE=$(wc -c < public/contributors.json)
          PEOPLE_FILE_SIZE=$(wc -c < public/people.json)
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "contributors.json is suspiciously small (${FILE_SIZE} bytes) — skipping commit"
            exit 1
          fi
          if [ "$PEOPLE_FILE_SIZE" -lt 1000 ]; then
            echo "people.json is suspiciously small (${PEOPLE_FILE_SIZE} bytes) — skipping commit"
            exit 1
          fi
          if git diff --quiet public/contributors.json public/contributors-meta.json public/people.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/contributors.json public/contributors-meta.json public/people.json
          git commit -m "chore: update contributors"
          git push

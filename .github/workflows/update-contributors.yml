name: Update contributors

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect contributors
        env:
          NUXT_GITHUB_TOKEN: ${{ secrets.NUXT_GITHUB_TOKEN }}
        run: pnpm collect:contributors

      - name: Commit and push if changed
        run: |
          FILE_SIZE=$(wc -c < public/contributors.json)
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "contributors.json is suspiciously small (${FILE_SIZE} bytes) — skipping commit"
            exit 1
          fi
          if git diff --quiet public/contributors.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/contributors.json
          git commit -m "chore: update contributors"
          git push

name: Update contributors

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - name: Collect contributors
        env:
          NUXT_GITHUB_TOKEN: ${{ secrets.NUXT_GITHUB_TOKEN }}
        run: pnpm collect:contributors

      - name: Commit and push if changed
        run: |
          FILE_SIZE=$(wc -c < public/contributors.json)
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "contributors.json is suspiciously small (${FILE_SIZE} bytes) — skipping commit"
            exit 1
          fi
          # contributors.json (all time), contributors-30d.json, contributors-12m.json, contributors-<year>.json
          # `git status` also sees new files, e.g. the first file of a new year.
          if [ -z "$(git status --porcelain -- 'public/contributors*.json')" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'public/contributors*.json'
          git commit -m "chore: update contributors"
          git push
